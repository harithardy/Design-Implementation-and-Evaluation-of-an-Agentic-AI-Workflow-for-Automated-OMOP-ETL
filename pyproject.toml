[project]
name = "capstone-v1"
version = "0.1.0"
description = "OMOP table loader built with LangGraph."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "openpyxl>=3.1.0",
    "pyodbc>=5.1.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
